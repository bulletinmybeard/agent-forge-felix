[project]
name = "felix"
version = "0.1.0"
description = "Autonomous local diagnostic-repair agent: diagnose. fix. verify."
authors = [{ name = "Robin Schulz", email = "walktheweb@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "websockets>=12.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff (>=0.15.16,<0.16.0)",
]

[project.scripts]
felix = "felix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["felix"]
include = ["felix/skills/sources.yaml", "felix/skills/anchors/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.15"
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"

