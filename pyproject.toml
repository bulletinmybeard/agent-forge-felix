[project]
name = "felix"
version = "0.2.1"
description = "Autonomous local diagnostic-repair agent: diagnose. fix. verify."
authors = [{ name = "Robin Schulz" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
dependencies = [
    "click>=8.4.2",
    "rich>=14.2.0,<15.0.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "chalkbox (>=2.3.5,<3.0.0)",
]

[project.scripts]
felix = "felix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["felix"]
include = ["felix/skills/sources.yaml", "felix/skills/anchors/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "E741", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["felix"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "felix.report",
    "felix.api.ws",
    "felix.api.search",
    "felix.api.rest",
    "felix.cli",
]
ignore_errors = true

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"

